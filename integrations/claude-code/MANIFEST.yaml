# RWP™ Integration Manifest for Claude Code
#
# This manifest describes the RWP integration components available
# for Claude Code. Copy the relevant files to your project's
# .claude/ directory to enable RWP workflow support.
#
# Rhumb Workflow Protocol™ (RWP™) - https://rhumbprotocol.dev

integration:
  name: "Rhumb Workflow Protocol™ (RWP™)"
  platform: "claude-code"
  rwp_version: "0.29.0"
  version: "0.1.0"
  description: "RWP™ plan management integration for Claude Code"

components:
  commands:
    - name: plan
      path: commands/plan.md
      description: "RWP-aware /plan slash command for conversational plan generation"
      usage: "/plan, /plan commit, /plan review"

  project_instructions:
    - name: CLAUDE-RWP
      path: CLAUDE-RWP.md
      description: "Project-level instructions for RWP-enabled workspaces"
      install_target: "CLAUDE.md (append or use as base)"

installation:
  steps:
    - description: "Copy the plan command to your Claude Code commands directory"
      from: "commands/plan.md"
      to: ".claude/commands/rwp-plan.md"

    - description: "Append RWP™ instructions to your project CLAUDE.md"
      from: "CLAUDE-RWP.md"
      to: "CLAUDE.md"
      mode: "append"

  notes:
    - "Consider adapting the plan command to match your project's naming conventions"
    - "The CLAUDE-RWP.md content can be customized for your specific workflow"
    - "RWP™ templates are referenced from the RWP™ package's templates/ directory"

templates:
  referenced:
    - "PLAN.md.template"
    - "INTAKE.yaml.template"
    - "MASTERPLAN.yaml.template"
    - "MANIFEST-PLAN.yaml.template"
    - "PLAN-STATE.yaml.template"
    - "DEPENDENCIES.yaml.template"
    - "START-PROMPT.md.template"
    - "PROMPT.md.template"
    - "display/PLAN-DRAFT-DISPLAY.md.template"
    - "display/PLAN-COMMIT-DISPLAY.md.template"
    - "display/PHASE-COMPLETE-DISPLAY.md.template"
    - "display/SUBPHASE-COMPLETE-DISPLAY.md.template"

schemas:
  referenced:
    - "spec/schemas/plan.schema.json"
    - "spec/schemas/intake.schema.json"
    - "spec/schemas/state.schema.json"
    - "spec/schemas/manifest.schema.json"
    - "spec/schemas/handoff.schema.json"

