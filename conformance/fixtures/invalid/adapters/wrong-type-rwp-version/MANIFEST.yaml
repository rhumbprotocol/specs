# ADP-4 negative fixture: integration.rwp_version is a YAML float,
# not a string. YAML parses unquoted "1.0" as a float; this fixture
# demonstrates that the validator catches type drift even when the
# manifest is otherwise valid YAML. Implementers must quote
# version strings.

integration:
  name: "Wrong-Type Adapter"
  platform: "wrong-type-platform"
  rwp_version: 1.0
  version: "0.1.0"

components: {}
