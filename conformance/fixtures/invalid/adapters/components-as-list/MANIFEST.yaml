# ADP-6 negative fixture: `components:` is present but is a list,
# not a mapping. The validator must emit an AdapterShapeMismatch
# with message prefix "ADP-6" mentioning "not a mapping". Empty maps
# (`components: {}`) are accepted; YAML lists are not.

integration:
  name: "Components-As-List Adapter"
  platform: "components-as-list-platform"
  rwp_version: "1.0.0-rc.1"
  version: "0.1.0"

components:
  - commands
  - rules
  - knowledge
